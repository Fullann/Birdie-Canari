esphome:
  name: qualite-air-xiao
  friendly_name: Birdie DIY
  on_boot:
    priority: -100
    then:
      - component.update: battery_adc
      - wait_until:
          condition:
            time.has_time:
      - delay: 15s
      - wait_until:
          condition:
            lambda: 'return id(co2_sensor).has_state();'
      - script.execute: check_air_and_move
      - delay: 3s
      - script.execute: manage_sleep

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:

api:

ota:
  platform: esphome

wifi:
  ssid: "TON_WIFI"
  password: "TON_MOT_DE_PASSE"
  fast_connect: true 
  ap:
    ssid: "BirdieDIYFallback"
    password: "12345678"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# ── Variables d'état persistantes en mémoire RTC / Flash ────────────────
globals:
  # État de l'oiseau : true = en bas (alerte), false = en haut (normal)
  - id: bird_is_down
    type: bool
    restore_value: true
    initial_value: 'false'

  # Premier démarrage : permet d'initialiser la position physique du servo
  - id: is_first_boot
    type: bool
    restore_value: true
    initial_value: 'true'

  # Durée du prochain sommeil profond (en secondes)
  # Par défaut : 10 minutes (600s) en veille normale
  - id: sleep_duration_seconds
    type: int
    restore_value: false
    initial_value: '600'

i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true

sensor:
  - platform: scd4x
    co2:
      name: "CO2"
      id: co2_sensor
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Humidite"
      id: hum_sensor
    address: 0x62
    update_interval: 15s

  # ── Surveillance de la batterie LiPo (Pont diviseur R1=100k / R2=100k) ──
  - platform: adc
    pin: GPIO0
    name: "Qualité Air Xiao Batterie Tension"
    id: battery_adc
    update_interval: never
    attenuation: 12db
    filters:
      - multiply: 2.0  # Compense le pont diviseur (divisé par 2)

  - platform: copy
    source_id: battery_adc
    name: "Qualité Air Xiao Batterie Pourcentage"
    id: battery_percent
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    filters:
      - lambda: |-
          float v = x;
          if (v >= 4.15) return 100.0;
          if (v <= 3.25) return 0.0;
          if (v > 3.80)  return 60.0 + (v - 3.80) * (40.0 / (4.15 - 3.80));
          if (v > 3.65)  return 20.0 + (v - 3.65) * (40.0 / (3.80 - 3.65));
          return (v - 3.25) * (20.0 / (3.65 - 3.25));
  # ──────────────────────────────────────────────────────────────────────

output:
  - platform: ledc
    pin: GPIO2
    id: servo_output
    frequency: 50 Hz

servo:
  - id: air_servo
    output: servo_output
    transition_length: 2s
    auto_detach_time: 1s

# Capteur textuel d'état pour le tableau de bord Home Assistant
text_sensor:
  - platform: template
    name: "Etat Birdie"
    id: birdie_state
    icon: "mdi:bird"

script:
  - id: bird_up
    then:
      - servo.write:
          id: air_servo
          level: 100%
      - globals.set:
          id: bird_is_down
          value: 'false'

  - id: bird_down
    then:
      - servo.write:
          id: air_servo
          level: -100%
      - globals.set:
          id: bird_is_down
          value: 'true'

  - id: check_air_and_move
    then:
      - lambda: |-
          if (!id(co2_sensor).has_state()) return;

          float co2 = id(co2_sensor).state;
          bool currently_down = id(bird_is_down);
          bool first_boot = id(is_first_boot);

          ESP_LOGI("birdie", "Mesure CO2 : %.1f ppm | Position oiseau : %s",
                   co2, currently_down ? "BAS" : "HAUT");

          // Initialisation au premier démarrage de la carte
          if (first_boot) {
            id(is_first_boot) = false;
            if (!currently_down && co2 <= 1000.0f) {
              ESP_LOGI("birdie", "Premier démarrage : positionnement de l'oiseau en HAUT.");
              id(bird_up).execute();
            }
          }

          if (!currently_down) {
            // ── CAS 1 : L'oiseau est actuellement EN HAUT ──────────────────
            if (co2 > 1000.0f) {
              // CO2 > 1 000 ppm : l'air se dégrade → l'oiseau descend
              ESP_LOGW("birdie", "CO2 > 1000 ppm (%.1f ppm) ! Descente de l'oiseau. Mode alerte (mesure toutes les 2 min).", co2);
              id(bird_down).execute();
              id(birdie_state).publish_state("Mauvais - Ouvrez les fenêtres !");
              // Quand l'oiseau est en bas : mesure toutes les 2 minutes (120 s)
              id(sleep_duration_seconds) = 120;
            } else {
              // Air sain (< 1 000 ppm) : maintien en haut sans mouvement de servo
              id(birdie_state).publish_state("Bon - Air frais");
              // Veille normale : mesure toutes les 10 minutes (600 s)
              id(sleep_duration_seconds) = 600;
              ESP_LOGD("birdie", "Air sain (%.1f ppm). Prochaine mesure dans 10 minutes.", co2);
            }
          } else {
            // ── CAS 2 : L'oiseau est actuellement EN BAS ───────────────────
            if (co2 < 950.0f) {
              // CO2 repasse sous 950 ppm : fenêtre ouverte, l'air est purifié !
              ESP_LOGI("birdie", "CO2 sous 950 ppm (%.1f ppm) ! L'oiseau remonte. Cooldown 2 heures.", co2);
              id(bird_up).execute();
              id(birdie_state).publish_state("Repos / Cooldown (2h)");
              // Période de repos (Cooldown) : 2 heures sans mouvement pour préserver la batterie
              id(sleep_duration_seconds) = 7200; // 2 heures = 7200 s
            } else {
              // Air toujours dégradé (>= 950 ppm) : maintien en bas sans mouvement
              id(birdie_state).publish_state("Mauvais - Ouvrez les fenêtres !");
              // Fréquence accélérée : nouvelle vérification dans 2 minutes
              id(sleep_duration_seconds) = 120;
              ESP_LOGD("birdie", "Air toujours dégradé (%.1f ppm). Maintien en bas, re-mesure dans 2 minutes.", co2);
            }
          }

  - id: manage_sleep
    then:
      - lambda: |-
          int sleep_sec = id(sleep_duration_seconds);

          auto now = id(ha_time).now();
          if (now.is_valid()) {
            int now_sec = now.hour * 3600 + now.minute * 60 + now.second;
            const int active_start = 7  * 3600; // 07:00
            const int sleep_start  = 22 * 3600; // 22:00

            bool is_night = (now_sec >= sleep_start || now_sec < active_start);

            // Si c'est la nuit (22h - 7h) et que l'air est bon (oiseau en haut),
            // on dort jusqu'à 07h00 du matin pour une autonomie maximale.
            if (is_night && !id(bird_is_down)) {
              int target_sec = active_start;
              if (now_sec >= sleep_start) target_sec += 24 * 3600;
              int night_sleep_sec = target_sec - now_sec;

              if (night_sleep_sec > sleep_sec) {
                sleep_sec = night_sleep_sec;
                ESP_LOGI("birdie", "Nuit active : sommeil étendu jusqu'à 07h00 (%d s).", sleep_sec);
              }
            }
          } else {
            ESP_LOGW("birdie", "Heure HA non disponible. Utilisation de la durée programmée (%d s).", sleep_sec);
          }

          ESP_LOGI("birdie", "Passage en Deep-Sleep pendant %d secondes (%.1f minutes). Consommation < 10 µA.",
                   sleep_sec, sleep_sec / 60.0f);
          id(deep_sleep_control).set_sleep_duration((uint64_t)sleep_sec * 1000ULL);
      - deep_sleep.enter: deep_sleep_control

deep_sleep:
  id: deep_sleep_control
