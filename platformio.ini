[platformio]
default_envs = birdie_zigbee

; ------------------------------------------------------------------------------
; Choisissez le firmware à compiler / flasher en décommentant une des 3 lignes :
; ------------------------------------------------------------------------------
src_dir = arduino/birdie_zigbee
; src_dir = arduino/birdie_bthome
; src_dir = arduino/birdie_standalone_v2
; src_dir = arduino/birdie_standalone





[env:birdie_zigbee]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
board_build.partitions = zigbee.csv
framework = arduino
monitor_speed = 115200


lib_deps =
    sensirion/Sensirion I2C SCD4x @ ^0.4.0
    madhephaestus/ESP32Servo @ ^3.0.5

build_flags =
    -D ZIGBEE_MODE_ED
    -Wl,-lesp_zb_api.ed
    -Wl,-lzboss_stack.ed
    -Wl,-lzboss_port.native
